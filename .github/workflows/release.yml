name: Publish VerseGlass release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag, bundle versions, and release notes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[1-9][0-9]*(\.[0-9]+)?$ ]]
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(uname -m)" = arm64
          version=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          [[ "$TAG" == "v$version" || ("$TAG" != *.* && "$TAG.0" == "v$version") ]]
          for key in CFBundleVersion CFBundleShortVersionString; do
            test "$(plutil -extract "$key" raw Info.plist)" = "$(plutil -extract "$key" raw Saver/Info.plist)"
          done
          mkdir -p build/release
          awk -v title="## $TAG" '$0 == title { found=1; next } /^## / && found { exit } found { print }' CHANGELOG.md > build/release/notes.md
          grep -q '[^[:space:]]' build/release/notes.md
          printf '\nRequires macOS 15 or later on Apple silicon. The app is ad-hoc signed and has not been notarized by Apple.\n' >> build/release/notes.md
          printf '\niPadOS 17 or later. The iPad IPA requires personal signing. [iPad installation guide](https://github.com/%s/blob/%s/docs/ipad.md)\n' \
            "$GITHUB_REPOSITORY" "$TAG" >> build/release/notes.md

      - name: Build and package
        run: |
          ./build.sh
          ./Tools/package-release.sh
          ./Tools/package-ipad.sh
          cd build/release
          shasum -a 256 VerseGlass-macOS-arm64.dmg VerseGlass-iPad-unsigned.ipa > SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: build/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Publish both apps and their checksums
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          image=VerseGlass-macOS-arm64.dmg
          ipad=VerseGlass-iPad-unsigned.ipa
          sha256sum --check --strict SHA256SUMS.txt
          if ! gh release view "$TAG" --json isDraft > /dev/null; then
            gh release create "$TAG" --verify-tag --draft --title "VerseGlass $TAG" --notes-file notes.md
          fi
          metadata=$(gh release view "$TAG" --json assets,isDraft)
          if [[ $(jq -r '.isDraft' <<< "$metadata") == false ]]; then
            # A published release is final. Verify its public downloads on a rerun.
            mkdir published
            gh release download "$TAG" --pattern "$image" --pattern "$ipad" --pattern SHA256SUMS.txt --dir published
            (cd published && sha256sum "$image" "$ipad" | cmp - SHA256SUMS.txt)
            exit 0
          fi
          for asset in "$image" "$ipad" SHA256SUMS.txt; do
            expected="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            existing=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest // "unknown"' <<< "$metadata")
            if [[ -z "$existing" ]]; then
              gh release upload "$TAG" "$asset"
            elif [[ "$existing" != "$expected" ]]; then
              echo "Draft contains a different $asset. Re-run the original failed publish job or review the draft." >&2
              exit 1
            fi
            gh release view "$TAG" --json assets | jq -e --arg name "$asset" --arg digest "$expected" \
              'any(.assets[]; .name == $name and .state == "uploaded" and .digest == $digest)' > /dev/null
          done
          gh release edit "$TAG" --verify-tag --draft=false
